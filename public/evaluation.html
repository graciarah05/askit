<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Askit 비공개 품질 검증</title><link rel="stylesheet" href="./styles.css"><main class="shell"><h1>비공개 품질 검증</h1><p>같은 사례를 직접 요청·기존 프롬프트·Argon 프롬프트로 비교합니다. 실행하면 실제 API 사용료가 발생합니다.</p><p id="availability" role="status">연결 확인 중</p><form id="evaluation-form"><label for="case-id">사례</label><select id="case-id"></select><label for="variant">경로</label><select id="variant"><option value="argon">Argon 프롬프트</option><option value="baseline">기존 프롬프트</option><option value="plain">직접 요청</option><option value="generic-editor">일반적인 프롬프트 개선 요청</option></select><label for="thinking">프롬프트 작성 추론 수준</label><select id="thinking"><option value="low">LOW</option><option value="medium">MEDIUM</option></select><button id="run" class="btn primary full" disabled>한 건 실행</button></form><p id="status" role="status"></p><pre id="metrics"></pre><label for="result">요청·응답 원문</label><textarea id="result" rows="24" readonly></textarea><button id="export" class="btn full">누적 기록 다운로드</button><script type="module" src="./evaluation.js"></script></main></html>
